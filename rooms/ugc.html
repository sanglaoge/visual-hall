<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>买家秀厅 · 视觉厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f11'/%3E%3Cpath d='M16 20l16 26 16-26' stroke='%23f4f1ea' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("vh-theme");document.documentElement.setAttribute("data-theme",t||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="stylesheet" href="../assets/gallery.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="../">视觉厅</a>
  <nav>
    <a href="../">总览</a>
    <a href="./main-images.html">主图</a>
    <a href="./videos.html">视频</a>
    <a href="./accessories.html">辅料</a>
    <a href="./ugc.html" aria-current="page">买家秀</a>
    <a href="../builds/kingrest-showcase/">案例</a>
  </nav>
</div>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Room 04 · UGC</div>
    <h1>买家秀厅</h1>
    <p class="lede">生活场景里的真实使用感：沙发上、床铺上、宠物身上、手指按压面料的回弹。按产品分。</p>
    <div class="counts">
      <span><b data-stat="ugc">—</b> 张成片</span>
      <span><b id="grpCount">—</b> 个产品</span>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid tall" id="rooms"></div>

  <div class="foot">
    <a href="../">← 回视觉厅</a>
    <span>点图看大图，可左右翻</span>
    <span>含 AI 场景合成，非真实买家上传</span>
  </div>
</div>

<script src="../assets/data/works.js"></script>
<script src="../assets/gallery.js"></script>
<script>
(function () {
  var data = (window.WORKS && window.WORKS.ugc) || [];
  var R = "../";
  var groups = [];
  data.forEach(function (u) { if (groups.indexOf(u.group) < 0) groups.push(u.group); });
  groups = ["全部"].concat(groups);
  var current = "全部";
  var filters = document.getElementById("filters");
  document.getElementById("grpCount").textContent = groups.length - 1;

  filters.innerHTML = groups.map(function (g) {
    return '<button class="chip" data-group="' + g + '" aria-pressed="' + (g === "全部") + '">' + g + '</button>';
  }).join("");

  filters.addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    current = b.dataset.group;
    filters.querySelectorAll(".chip").forEach(function (c) {
      c.setAttribute("aria-pressed", String(c === b));
    });
    paint();
  });

  function paint() {
    document.getElementById("rooms").innerHTML = data.filter(function (u) {
      return current === "全部" || u.group === current;
    }).map(function (u) {
      return '<button class="card tall" data-image="' + R + u.src + '" data-title="' + u.title + '">' +
        '<span class="media"><img src="' + R + u.src + '" alt="' + u.title + '" loading="lazy"></span>' +
        '<span class="cap">' + u.group + '<em>UGC</em></span></button>';
    }).join("");
  }

  paint();
})();
</script>
</body>
</html>
