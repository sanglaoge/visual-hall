<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>辅料厅 · 视觉厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f11'/%3E%3Cpath d='M16 20l16 26 16-26' stroke='%23f4f1ea' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("vh-theme");document.documentElement.setAttribute("data-theme",t||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="stylesheet" href="../assets/gallery.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="../">视觉厅</a>
  <nav>
    <a href="../">总览</a>
    <a href="./main-images.html">主图</a>
    <a href="./videos.html">视频</a>
    <a href="./accessories.html" aria-current="page">辅料</a>
    <a href="./ugc.html">买家秀</a>
    <a href="../builds/kingrest-showcase/">案例</a>
  </nav>
</div>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Room 03 · Print &amp; Pack</div>
    <h1>辅料厅</h1>
    <p class="lede">包装盒、彩卡、材质说明与规格页。下单前客户看的是这些，落地时工厂照着这些做。</p>
    <div class="counts">
      <span><b data-stat="acc">—</b> 份印刷件</span>
      <span><b>包装盒 / 彩卡 / 材质说明</b></span>
    </div>
  </header>

  <div id="rooms" style="display:grid;gap:clamp(12px,2vw,22px);grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>

  <div class="foot">
    <a href="../">← 回视觉厅</a>
    <span>点图看大图</span>
    <span>仅展示首屏，完整文件在源目录</span>
  </div>
</div>

<script src="../assets/data/works.js"></script>
<script src="../assets/gallery.js"></script>
<script>
(function () {
  var data = (window.WORKS && window.WORKS.acc) || [];
  var R = "../";
  document.getElementById("rooms").innerHTML = data.map(function (a) {
    return '<article class="vcard">' +
      '<div class="frame" data-image="' + R + a.preview + '" data-title="' + a.title +
      '" style="aspect-ratio:4/3;cursor:zoom-in">' +
      '<img src="' + R + a.preview + '" alt="' + a.title + '" loading="lazy" style="object-fit:contain;background:#121214"></div>' +
      '<div class="meta">' + a.title + '<em>' + a.type + '</em></div></article>';
  }).join("");
})();
</script>
</body>
</html>
