<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>品牌 · 视觉厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f11'/%3E%3Cpath d='M16 20l16 26 16-26' stroke='%23f4f1ea' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("vh-theme");document.documentElement.setAttribute("data-theme",t||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/gallery.css">
<style>
  .b-head{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.72fr); gap:clamp(20px,4vw,48px); align-items:center;
    padding:clamp(20px,4vh,40px) 0 clamp(18px,3vh,28px); }
  .b-logo{ display:inline-flex; align-items:center; background:#fff; padding:8px 10px; margin-bottom:16px; border:1px solid var(--line2); }
  .b-logo img{ height:24px; width:auto; display:block; }
  .b-head .cover{ position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--ink2); border:1px solid var(--line2); order:2; }
  .b-head .cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:var(--ink2); opacity:0; transition:opacity .9s ease; }
  .b-head .cover img.on{ opacity:1; }
  .b-head .cover .dots{ position:absolute; right:12px; bottom:12px; z-index:2; display:flex; gap:6px; }
  .b-head .cover .dot{ width:22px; height:3px; border:0; padding:0; background:rgba(255,255,255,.42); cursor:pointer; }
  .b-head .cover .dot.on{ background:#fff; }
  .b-head h1{ font-family:"Archivo",var(--sans); font-size:clamp(40px,8vw,76px); font-weight:600; letter-spacing:-.03em; line-height:1; }
  .b-head .lede{ margin-top:16px; color:var(--soft); font-size:14px; line-height:2; max-width:30em; }
  .cats{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  @media (max-width:760px){ .b-head{ grid-template-columns:1fr; } .b-head .cover{ order:0; } }
  #filters { top: 49px; }
  section.group { scroll-margin-top: 120px; }
  .group-head h2 { font-family: "Archivo", var(--sans); font-weight: 600; letter-spacing: 0; }
  .group-head .num { font-family: var(--sans); }
  .card .cap { align-items: flex-start; }
  .card .cap-name { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card .cap b { font-family: "Archivo", var(--sans); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .card .cap i { font-style: normal; max-width: 17em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--sans); font-size: 10px; letter-spacing: .04em; color: var(--muted); }
  .card .cap em { flex: none; white-space: nowrap; }
  @media (max-width:640px){ .card .cap i { max-width: 11em; } }
  .card.tall .media { aspect-ratio: 1 / 1; }
  .card .media img { object-fit: contain; background: var(--ink2); }
  .pcard .ph { aspect-ratio: 1 / 1; }
  .pcard .ph img { object-fit: contain; background: var(--ink2); }
  .filter-note { margin: 0 0 18px; font-family: var(--sans); font-size: 11px; letter-spacing: .06em; color: var(--muted); }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="./">视觉厅</a>
  <nav>
    <a href="./">总览</a>
    <a href="library.html">全部作品</a>
    <a href="videos.html">视频</a>
    <a href="accessories.html">辅料</a>
    <a href="ugc.html">买家秀</a>
  </nav>
</div>

<div class="wrap" id="page">
  <p style="padding-top:28px"><a class="back" href="library.html">← 全部作品</a></p>
  <div id="body"></div>
  <div class="foot">
    <a href="library.html">← 回全部作品</a>
    <span>点图看大图</span>
    <span>Updated 2026.11.06</span>
  </div>
</div>

<script src="assets/data/works.js"></script>
<script src="assets/data/gogreen-selection.js"></script>
<script src="assets/data/hitime-selection.js"></script>
<script src="assets/data/kingrest-selection.js"></script>
<script src="assets/gallery.js"></script>
<script>
(function () {
  var W = window.WORKS || {};
  function thumb(src) { return src && src.indexOf("assets/orbit/") === 0 ? src.replace("assets/orbit/", "assets/covers/") : src; }
  var key = new URLSearchParams(location.search).get("b");
  var brand = (W.brands || []).find(function (b) { return b.key === key; });
  var body = document.getElementById("body");

  if (!brand) {
    body.innerHTML = '<header class="page-head"><div class="eyebrow">Not found</div><h1>没有这个品牌</h1>' +
      '<p class="lede">链接可能过期了，回全部作品重新选。</p></header>';
    document.title = "未找到 · 视觉厅";
    return;
  }

  document.title = brand.name + " · 视觉厅";
  var isOwn = brand.key === "own";
  var cats = brand.categories || [];
  var accIds = brand.acc || [];
  var acc = (W.acc || []).filter(function (a) { return accIds.indexOf(a.id) > -1 && a.kind !== "三视图"; });

  var BRAND_LOGOS = {
    gogreen: "assets/brand-logos/gogreen-horizontal.png",
    hitime: "assets/brand-logos/Hitime-primary.png",
    kingrest: "assets/brand-logos/Kingrest-dark.png"
  };
  var SELECTION = brand.key === "gogreen" ? (window.GOGREEN_SELECTION || null)
    : brand.key === "hitime" ? (window.HITIME_SELECTION || null)
    : brand.key === "kingrest" ? (window.KINGREST_SELECTION || null) : null;
  var HIDE_SETS = { "a25-116": 1, "a25-117": 1 };
  var CLEAN_COVERS = {
    "a25-013": 1, "a25-014": 1, "a25-016": 1, "a25-019": 1, "a25-020": 1,
    "a25-118": 1, "a25-119": 1, "a25-120": 1, "a25-125": 1,
    "a25-162": 1, "a25-163": 1, "a25-164": 1, "a25-165": 1, "a25-166": 1,
    "a25-167": 1, "a25-168": 1, "a25-169": 1, "a25-170": 1, "a25-171": 1,
    "a25-172": 1, "a25-173": 1, "a25-174": 1, "a25-175": 1, "a25-176": 1
  };
  var allSets = brand.sets || [];
  function selected(s) { return SELECTION && SELECTION.sets ? SELECTION.sets[s.id] : null; }
  function excluded(s) { var r = selected(s); return r && r.exclude ? r.exclude : []; }
  function kept(s) { var ex = excluded(s); return s.images.filter(function (p, i) { return ex.indexOf(i) === -1; }); }
  var sets = isOwn ? [] : allSets.filter(function (s) {
    return !HIDE_SETS[s.id] && kept(s).length > 0;
  });
  var shownCount = isOwn ? brand.count : sets.length;
  var shownImages = isOwn ? brand.images : sets.reduce(function (a, s) { return a + kept(s).length; }, 0);
  var TEXT_COVERS = { "a25-118": 1, "a25-119": 1, "a25-120": 1, "a25-125": 1 };
  function coverFor(s) {
    if (TEXT_COVERS[s.id] && CLEAN_COVERS[s.id]) return "assets/covers-clean/" + s.id + ".webp";
    var r = selected(s), ks = kept(s);
    if (r && r.cover && ks.indexOf(r.cover) > -1) return "assets/covers-selected/" + s.id + ".webp";
    if (ks.length && ks.indexOf(s.cover) === -1) return ks[0];
    return CLEAN_COVERS[s.id] ? "assets/covers-clean/" + s.id + ".webp" : thumb(s.cover);
  }
  var heroImgs = SELECTION && SELECTION.hero && SELECTION.hero.length ? SELECTION.hero.slice(0, 5) : [brand.cover];
  var heroHtml = '<div class="cover">' + heroImgs.map(function (p, i) {
    return '<img src="' + p + '" alt="' + brand.name + ' ' + (i + 1) + '" class="' + (i === 0 ? "on" : "") + '">';
  }).join("") + (heroImgs.length > 1 ? '<div class="dots">' + heroImgs.map(function (_, i) {
    return '<button type="button" class="dot' + (i === 0 ? " on" : "") + '" data-dot="' + i + '" aria-label="第 ' + (i + 1) + ' 张"></button>';
  }).join("") + '</div>' : "") + '</div>';

  var logoHtml = !isOwn && BRAND_LOGOS[brand.key] ? '<span class="b-logo"><img src="' + BRAND_LOGOS[brand.key] + '" alt="' + brand.name + '"></span>' : '';
  var html = '<header class="b-head"><div>' + logoHtml +
    '<div class="eyebrow">' + (isOwn ? "2026 · 新品" : "2025 · 品牌线") + '</div>' +
    '<h1>' + brand.name + '</h1>' +
    '<div class="p-meta"><span><b>' + shownCount + '</b> 套</span><span><b>' + shownImages + '</b> 张主图</span>' +
    (acc.length ? '<a class="stat-jump" href="#acc"><b>' + acc.length + '</b> 份辅料 ↓</a>' : '') + '</div>' +
    '<p class="lede">' + (isOwn
      ? '2026 年的新品与节日系列，按产品品类分。点进去看整套主图、视频、买家秀和辅料。'
      : '2025 年 ' + brand.name + ' 品牌，按品类分。点开任意一套看完整主图。') + '</p>' +
    '</div>' + heroHtml + '</header>';

  if (isOwn) {
    var products = (W.products || []).filter(function (p) { return (brand.products || []).indexOf(p.key) > -1; });
    html += '<div class="label"><h2>品类</h2><span>' + products.length + ' 个</span></div><div class="pgrid">';
    products.forEach(function (p) {
      var cover = p.sets.length ? thumb(p.sets[0].cover) : "";
      if (!cover && p.ugc.length) {
        var u = (W.ugc || []).find(function (x) { return x.id === p.ugc[0]; });
        cover = u ? u.src : "";
      }
      if (!cover && p.acc.length) {
        var a0 = (W.acc || []).find(function (x) { return x.id === p.acc[0]; });
        cover = a0 ? a0.preview : "";
      }
      var shots = p.sets.reduce(function (a, s) { return a + s.count; }, 0);
      var tags = [];
      if (p.sets.length) tags.push(p.sets.length + " 套主图");
      if (p.videos.length) tags.push(p.videos.length + " 条视频");
      if (p.ugc.length) tags.push(p.ugc.length + " 张买家秀");
      if (p.acc.length) tags.push(p.acc.length + " 份辅料");
      html += '<a class="pcard" href="product.html?p=' + p.key + '">' +
        '<div class="ph"><img src="' + cover + '" alt="' + p.name + '" loading="lazy"></div>' +
        '<div class="info"><h3>' + p.name + '</h3><span class="n">' + (shots ? shots + " 张" : "") + '</span></div>' +
        '<div class="tags">' + tags.map(function (t) { return "<span>" + t + "</span>"; }).join("") + '</div></a>';
    });
    html += '</div>';
  } else {
    html += '<div class="filters" id="filters"><button class="chip" data-cat="all" aria-pressed="true">全部 ' + sets.length + '</button>' +
      cats.map(function (c, i) {
        var n = sets.filter(function (s) { return s.cat === c.name; }).length;
        if (!n) return "";
        return '<button class="chip" data-cat="' + i + '" aria-pressed="false">' + c.name + ' ' + n + '</button>';
      }).join("") + '</div>';
    var hidden = allSets.length - sets.length;
    if (hidden) html += '<p class="filter-note">部分套图为功能图，暂未收录。</p>';
    html += '<div id="setsTop"></div>';
    html += '<div id="sets"></div>';
  }

  if (acc.length) {
    html += '<div class="label" id="acc"><h2>辅料</h2><span>' + acc.length + ' 份</span></div><div class="agrid">';
    acc.forEach(function (a) {
      html += '<article class="acard"><div class="ph" data-image="' + a.preview + '" data-title="' + a.title + '">' +
        '<img src="' + a.preview + '" alt="' + a.title + '" loading="lazy"></div>' +
        '<div class="info">' + a.title + '<em>' + a.kind + '</em></div>' +
        '<div class="sub">' + a.cat + '</div></article>';
    });
    html += '</div>';
  }

  body.innerHTML = html;

  var heroEl = document.querySelector(".b-head .cover");
  var heroPics = heroEl ? Array.prototype.slice.call(heroEl.querySelectorAll("img")) : [];
  if (heroPics.length > 1) {
    var heroIdx = 0, heroTimer = null;
    var dots = Array.prototype.slice.call(heroEl.querySelectorAll(".dot"));
    function showHero(i) {
      heroIdx = (i + heroPics.length) % heroPics.length;
      heroPics.forEach(function (im, j) { im.classList.toggle("on", j === heroIdx); });
      dots.forEach(function (d, j) { d.classList.toggle("on", j === heroIdx); });
    }
    function startHero() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      stopHero();
      heroTimer = setInterval(function () { showHero(heroIdx + 1); }, 5000);
    }
    function stopHero() { if (heroTimer) clearInterval(heroTimer); heroTimer = null; }
    dots.forEach(function (d) { d.addEventListener("click", function () { showHero(Number(d.dataset.dot)); startHero(); }); });
    heroEl.addEventListener("mouseenter", stopHero);
    heroEl.addEventListener("mouseleave", startHero);
    startHero();
  }

  if (isOwn) return;

  function shortTitle(sku) {
    var s = String(sku || "").replace(/^[A-Za-z]?\d+[-–—]/, "").replace(/^第[一二三四五六七八九十\d]+批[-–—]?/, "");
    s = s.split("/")[0].trim();
    s = s.replace(/[(（].*$/, "").trim();
    s = s.replace(/[-–—]\d+套$/, "").trim();
    return s || String(sku || "");
  }
  function subTitle(sku) {
    var s = String(sku || ""), p = s.split("/"), sub = "";
    if (p.length > 1) sub = p.slice(1).join(" / ").trim();
    else { var m = s.match(/[（(](.+)$/); if (m) sub = m[1].replace(/[）)]$/, "").trim(); }
    if (!sub) return "";
    if (/^\d+$/.test(sub)) return "款式 " + sub;
    var parts = sub.split(/[-–—]/).map(function (x) { return x.trim(); }).filter(Boolean);
    var cand = parts.length ? parts[parts.length - 1] : sub;
    cand = cand.replace(/^[0-9]+/, "").trim();
    if (!cand || /^[A-Z0-9]+$/i.test(cand)) return parts.length > 1 ? parts[0] : "";
    return cand;
  }

  function renderGroups(filter) {
    var html = "";
    cats.forEach(function (c, i) {
      if (filter !== "all" && String(i) !== String(filter)) return;
      var arr = sets.filter(function (s) { return s.cat === c.name; });
      if (!arr.length) return;
      html += '<section class="group" id="cat-' + i + '">' +
        '<div class="group-head"><h2>' + c.name + '</h2><span class="num">' + arr.length + ' 套</span></div>' +
        '<div class="grid tall">' +
        arr.map(function (s) {
          var st = shortTitle(s.sku), sub = subTitle(s.sku);
          var main = sub && sub.indexOf("款式 ") !== 0 ? sub : st;
          var minor = sub && sub.indexOf("款式 ") !== 0 ? st : sub;
          return '<button class="card tall" data-images=\'' + JSON.stringify(kept(s)) +
            '\' data-title="' + brand.name + " · " + s.sku + '" aria-label="' + brand.name + " · " + s.sku + '">' +
            '<span class="media"><img src="' + coverFor(s) + '" alt="' + s.sku + '" loading="lazy"></span>' +
            '<span class="cap"><span class="cap-name"><b>' + main + '</b>' + (minor ? '<i>' + minor + '</i>' : '') + '</span><em>' + kept(s).length + ' 张</em></span></button>';
        }).join("") +
        '</div></section>';
    });
    document.getElementById("sets").innerHTML = html;
  }

  function goTo(hash) {
    var el = document.querySelector(hash);
    if (!el) return;
    var y = el.getBoundingClientRect().top + scrollY - 112;
    scrollTo({ top: Math.max(0, y), behavior: reduceMotion ? "auto" : "smooth" });
  }
  var reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    this.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); });
    var v = b.dataset.cat;
    if (v === "all") { renderGroups("all"); goTo("#setsTop"); }
    else { renderGroups(v); goTo("#cat-" + v); }
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest(".stat-jump");
    if (!a) return;
    e.preventDefault();
    var el = document.getElementById("acc");
    if (!el) return;
    var html = document.documentElement, oldBehavior = html.style.scrollBehavior;
    html.style.scrollBehavior = "auto";
    el.scrollIntoView();
    window.scrollBy(0, -96);
    html.style.scrollBehavior = oldBehavior;
    history.replaceState(null, "", "#acc");
  });
  renderGroups("all");
})();
</script>
</body>
</html>
