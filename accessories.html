<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>辅料 · 视觉厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f11'/%3E%3Cpath d='M16 20l16 26 16-26' stroke='%23f4f1ea' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("vh-theme");document.documentElement.setAttribute("data-theme",t||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="stylesheet" href="assets/gallery.css">
<style>
  .filters + .filters{ top:92px; padding-top:0; }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="./">视觉厅</a>
  <nav>
    <a href="./">总览</a>
    <a href="library.html">全部作品</a>
    <a href="videos.html">视频</a>
    <a href="accessories.html" aria-current="page">辅料</a>
    <a href="ugc.html">买家秀</a>
  </nav>
</div>

<div class="wrap">
  <header class="page-head">
    <div class="eyebrow">Print &amp; Pack · 2025 / 2026</div>
    <h1>辅料</h1>
    <p class="lede">包装盒、彩卡、贴纸、洗标与刀版。按品牌和类型分，点开看印刷展开图和细节。</p>
    <div class="counts" id="counts"></div>
  </header>

  <div class="filters" id="brandFilters"></div>
  <div class="filters" id="kindFilters"></div>
  <div class="agrid" id="rooms"></div>

  <div class="foot">
    <a href="library.html">← 回全部作品</a>
    <span>点图看大图</span>
    <span>Updated 2026.11.06</span>
  </div>
</div>

<script src="assets/data/works.js"></script>
<script src="assets/gallery.js"></script>
<script>
(function () {
  var W = window.WORKS || {};
  var data = W.acc || [];
  var currentBrand = "全部", currentKind = "全部";

  document.getElementById("counts").innerHTML =
    "<span><b>" + data.length + "</b> 份辅料</span>" +
    "<span><b>" + new Set(data.map(function (a) { return a.brand || "2026 新品"; })).size + "</b> 个品牌</span>";

  var brands = ["全部", "GOGREEN", "HITIME", "KINGREST", "2026 新品"].filter(function (b) {
    return b === "全部" || data.some(function (a) { return (a.brand || "2026 新品") === b; });
  });
  var kinds = ["全部"]; var seen = {};
  data.forEach(function (a) { if (!seen[a.kind]) { seen[a.kind] = 1; kinds.push(a.kind); } });

  function chips(list, cur) {
    return list.map(function (k) {
      return '<button class="chip" data-v="' + k + '" aria-pressed="' + (k === cur) + '">' + k + '</button>';
    }).join("");
  }

  function paintFilters() {
    document.getElementById("brandFilters").innerHTML = chips(brands, currentBrand);
    document.getElementById("kindFilters").innerHTML = chips(kinds, currentKind);
  }

  function paint() {
    document.getElementById("rooms").innerHTML = data.filter(function (a) {
      var b = a.brand || "2026 新品";
      return (currentBrand === "全部" || b === currentBrand) &&
             (currentKind === "全部" || a.kind === currentKind);
    }).map(function (a) {
      var b = a.brand || "2026 新品";
      var imgs = a.images || [a.preview];
      return '<article class="acard">' +
        '<div class="ph" data-images=\'' + JSON.stringify(imgs) + '\' data-title="' + a.title + '">' +
        '<img src="' + a.preview + '" alt="' + a.title + '" loading="lazy"></div>' +
        '<div class="info">' + a.title + '<em>' + a.kind + '</em></div>' +
        '<div class="sub">' + b + (a.cat ? ' · ' + a.cat : '') + '</div></article>';
    }).join("");
    paintFilters();
  }

  document.getElementById("brandFilters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    currentBrand = b.dataset.v; paint();
  });
  document.getElementById("kindFilters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    currentKind = b.dataset.v; paint();
  });

  paint();
})();
</script>
</body>
</html>
