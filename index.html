<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>视觉厅 · 近一年视觉作品</title>
<style>
  :root{ --ink:#0f0f11; --paper:#f4f1ea; --muted:#8a8578; --line:rgba(244,241,234,.14); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:var(--ink); color:var(--paper);
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    display:grid; place-items:center; padding:6vw;
    -webkit-font-smoothing:antialiased;
  }
  main{ width:100%; max-width:640px; }
  .eyebrow{
    font-family:-apple-system,"PingFang SC",sans-serif;
    font-size:12px; letter-spacing:.34em; color:var(--muted);
    text-transform:uppercase; margin-bottom:clamp(18px,4vh,32px);
  }
  h1{
    font-size:clamp(52px,13vw,104px); font-weight:400;
    letter-spacing:.12em; line-height:1.05;
  }
  .rule{ height:1px; background:var(--line); margin:clamp(24px,5vh,40px) 0; }
  p{
    font-size:clamp(14px,3.6vw,16px); line-height:2;
    color:#c9c4b6; letter-spacing:.02em;
  }
  footer{
    margin-top:clamp(36px,9vh,72px);
    font-family:-apple-system,"PingFang SC",sans-serif;
    font-size:12px; letter-spacing:.16em; color:var(--muted);
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  a{ color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  a:hover{ border-color:var(--paper); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Visual Hall · 2025 — 2026</div>
  <h1>视觉厅</h1>
  <div class="rule"></div>
  <p>
    这里陈列近一年的电商视觉产出：产品主图、主图视频、买家秀与详情页。
    作品正在整理归位，页面会持续增删更新。
  </p>
  <footer>
    <span>筹备中 · 即将开展</span>
    <span>Updated 2026.10.30</span>
  </footer>
</main>
</body>
</html>
