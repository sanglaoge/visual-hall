<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>全部作品 · 视觉厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f0f11'/%3E%3Cpath d='M16 20l16 26 16-26' stroke='%23f4f1ea' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("vh-theme");document.documentElement.setAttribute("data-theme",t||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="stylesheet" href="assets/gallery.css">
<style>
  .hero2{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
    gap:clamp(24px,5vw,72px); align-items:center;
    padding:clamp(40px,9vh,96px) 0 clamp(28px,5vh,48px);
  }
  .hero2 h1{ font-size:clamp(52px,10vw,112px); font-weight:400; letter-spacing:.14em; line-height:1; }
  .hero2 .lede{ margin-top:clamp(18px,3.4vh,28px); max-width:26em; color:var(--soft); font-size:clamp(14px,3.2vw,16px); line-height:2.05; }
  .stage{ position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--ink2); border:1px solid var(--line2); }
  .stage img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.2s ease; }
  .stage img.on{ opacity:1; }
  .stage .cap{
    position:absolute; left:0; right:0; bottom:0; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-family:var(--sans); font-size:11px; letter-spacing:.14em; color:#f4f1ea;
    background:linear-gradient(transparent, rgba(10,10,12,.62));
  }
  .dots{ display:flex; gap:6px; }
  .dots i{ width:5px; height:5px; border-radius:50%; background:rgba(244,241,234,.35); transition:background .3s, transform .3s; }
  .dots i.on{ background:#f4f1ea; transform:scale(1.25); }

  .tri{ display:grid; gap:clamp(10px,1.6vw,16px); grid-template-columns:repeat(3,1fr); }
  .tile{
    position:relative; display:block; overflow:hidden; border:1px solid var(--line2);
    min-height:clamp(150px,20vw,230px); background:var(--ink2);
  }
  .tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.7; transition:opacity .45s, transform .8s; }
  .tile:hover img{ opacity:.9; transform:scale(1.04); }
  .tile .tv{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,10,12,.06), rgba(10,10,12,.72)); }
  .tile .tt{ position:absolute; inset:auto 0 0 0; padding:clamp(14px,2vw,20px); color:#f4f1ea; }
  .tile b{ font-family:var(--serif); font-weight:400; font-size:clamp(17px,2.2vw,21px); letter-spacing:.14em; }
  .tile span{ display:block; margin-top:6px; font-family:var(--sans); font-size:11px; letter-spacing:.12em; color:rgba(244,241,234,.75); }
  @media (max-width:820px){
    .hero2{ grid-template-columns:1fr; padding-top:32px; }
    .stage{ aspect-ratio:4/3; }
    .tri{ grid-template-columns:1fr; }
    .tile{ min-height:130px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="./">视觉厅</a>
  <nav>
    <a href="./" aria-current="page">总览</a>
    <a href="videos.html">视频</a>
    <a href="accessories.html">辅料</a>
    <a href="ugc.html">买家秀</a>
  </nav>
</div>

<div class="wrap">
  <header class="hero2">
    <div>
      <div class="eyebrow">All Works · Kingrest / GOGREEN · 2026</div>
      <h1>全部作品</h1>
      <p class="lede">
        按产品分类。点进去看这个产品的主图整套、视频、买家秀和辅料。
      </p>
    </div>
    <div class="stage" id="stage">
      <img alt="" id="stageA">
      <img alt="" id="stageB">
      <div class="cap">
        <span id="stageCap">—</span>
        <span class="dots" id="dots"></span>
      </div>
    </div>
  </header>

  <div class="label"><h2>产品</h2><span id="pCount">—</span></div>
  <div class="pgrid" id="products"></div>

  <div class="label"><h2>专项</h2><span>按素材类型看</span></div>
  <div class="tri">
    <a class="tile" href="videos.html">
      <img src="assets/video/v03.webp" alt="视频" loading="lazy">
      <span class="tv"></span>
      <span class="tt"><b>视频</b><span>主图视频 · AI 与代码生成</span></span>
    </a>
    <a class="tile" href="accessories.html">
      <img src="assets/acc/photo-electric-box.webp" alt="辅料" loading="lazy">
      <span class="tv"></span>
      <span class="tt"><b>辅料</b><span>包装盒 · 彩卡 · 材质说明</span></span>
    </a>
    <a class="tile" href="ugc.html">
      <img src="assets/ugc/006.webp" alt="买家秀" loading="lazy">
      <span class="tv"></span>
      <span class="tt"><b>买家秀</b><span>生活场景 · 面料特写</span></span>
    </a>
  </div>

  <div class="foot">
    <a href="https://sanglaoge.github.io/">回主页 ↗</a>
    <a href="builds/kingrest-showcase/">Kingrest 品牌站 · 延伸阅读</a>
    <span>Updated 2026.11.02</span>
  </div>
</div>

<script src="assets/data/works.js"></script>
<script src="assets/gallery.js"></script>
<script>
(function () {
  var W = window.WORKS || {};
  var products = W.products || [];
  var hero = W.hero || [];

  document.getElementById("pCount").textContent = products.length + " 个品类";

  var coverOf = function (p) {
    if (p.sets.length) return p.sets[0].cover;
    if (p.ugc.length) return (W.ugc.find(function (u) { return u.id === p.ugc[0]; }) || {}).src;
    if (p.acc.length) return (W.acc.find(function (a) { return a.id === p.acc[0]; }) || {}).preview;
    return "";
  };

  document.getElementById("products").innerHTML = products.map(function (p) {
    var tags = [];
    if (p.sets.length) tags.push(p.sets.length + " 套主图");
    if (p.videos.length) tags.push(p.videos.length + " 条视频");
    if (p.ugc.length) tags.push(p.ugc.length + " 张买家秀");
    if (p.acc.length) tags.push(p.acc.length + " 份辅料");
    return '<a class="pcard" href="product.html?p=' + p.key + '">' +
      '<div class="ph"><img src="' + coverOf(p) + '" alt="' + p.name + '" loading="lazy"></div>' +
      '<div class="info"><h3>' + p.name + '</h3><span class="n">' +
      (p.sets.length ? p.sets.reduce(function (a, s) { return a + s.count; }, 0) + " 张" : "") +
      '</span></div>' +
      '<div class="tags">' + tags.map(function (t) { return "<span>" + t + "</span>"; }).join("") + '</div>' +
      '</a>';
  }).join("");

  if (!hero.length) return;

  var A = document.getElementById("stageA"), B = document.getElementById("stageB");
  var cap = document.getElementById("stageCap"), dots = document.getElementById("dots");
  var layers = [A, B], cur = 0, idx = Math.floor(Math.random() * hero.length);
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var nameOf = function (src) {
    var hit = null;
    (W.products || []).forEach(function (p) {
      if (hit) return;
      if (p.sets.some(function (s) { return s.cover === src; })) hit = p.name;
    });
    return hit || "";
  };

  dots.innerHTML = hero.slice(0, 5).map(function () { return "<i></i>"; }).join("");

  function show(i) {
    idx = (i + hero.length) % hero.length;
    var next = 1 - cur;
    layers[next].src = hero[idx];
    layers[next].classList.add("on");
    layers[cur].classList.remove("on");
    cur = next;
    cap.textContent = nameOf(hero[idx]) || "精选主图";
    var ds = dots.children;
    for (var k = 0; k < ds.length; k++) ds[k].className = (k === idx % 5) ? "on" : "";
    var pre = new Image(); pre.src = hero[(idx + 1) % hero.length];
  }

  show(idx);
  if (!reduce) setInterval(function () { show(idx + 1); }, 6000);
})();
</script>
</body>
</html>
