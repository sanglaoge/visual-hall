<script src="assets/gallery.js"></script>
<script>
(function () {
  var W = window.WORKS || {};
  var data = W.ugc || [];
  var groups = [], seen = {};
  data.forEach(function (u) { if (!seen[u.group]) { seen[u.group] = 1; groups.push(u.group); } });
  groups = ["全部"].concat(groups);
  var current = "全部";
  var filters = document.getElementById("filters");

  filters.innerHTML = groups.map(function (g) {
    return '<button class="chip" data-group="' + g + '" aria-pressed="' + (g === "全部") + '">' + g + '</button>';
  }).join("");

  filters.addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    current = b.dataset.group;
    filters.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); });
    paint();
  });

  function paint() {
    var list = data.filter(function (u) { return current === "全部" || u.group === current; });
    document.getElementById("rooms").innerHTML = list.map(function (u) {
      return '<button class="m-item" data-image="' + u.src + '" data-title="' + u.title + '">' +
        '<img src="' + u.src + '" alt="' + u.title + '" loading="lazy">' +
        '<span class="tagx">' + u.group + '</span></button>';
    }).join("");
  }

  paint();
})();
</script>
