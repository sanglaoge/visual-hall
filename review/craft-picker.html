<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页辅料分组 · 视觉厅</title>
<style>
  :root{--paper:#f2f1ee;--surface:#fbfaf7;--ink:#14120f;--muted:#676157;--line:rgba(20,18,15,.16);--green:#439b44;--red:#b23b2e}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
  button{font:inherit;color:inherit} img{display:block}
  .top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:rgba(242,241,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top b{font-size:15px;letter-spacing:.04em}.top .grow{flex:1}.top .stat{font-size:12px;color:var(--muted)}
  .top button{border:1px solid var(--line);background:none;padding:7px 10px;cursor:pointer;font-size:12px}
  .top button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .groups{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0}
  .group{border:1px solid var(--line);background:none;padding:6px 11px;cursor:pointer;font-size:12px}
  .group.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:14px 20px 80px;max-width:1500px;margin:0 auto}
  .card{position:relative;border:2px solid transparent;background:var(--surface);cursor:pointer;text-align:left;padding:0;overflow:hidden}
  .card.on{border-color:var(--green)}
  .card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
  .meta{padding:8px 9px 10px}
  .meta b{display:block;font-size:12px;line-height:1.35;font-weight:600}
  .meta span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
  .badge{position:absolute;top:6px;right:6px;background:var(--green);color:#fff;font-size:10px;padding:3px 6px;display:none}
  .card.on .badge{display:block}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.on{opacity:1}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr);padding:12px 12px 100px}.top{padding:10px 12px}.groups{padding:10px 12px 0}}
</style>
<header class="top">
  <b>首页辅料 · 分品牌</b><span class="stat">2026 固定 6 · 三品牌各 5</span>
  <span class="grow"></span>
  <button type="button" id="copyBtn">复制 JSON</button>
  <button type="button" class="primary" id="exportBtn">导出 JSON</button>
</header>
<div class="groups" id="groups"></div>
<main class="grid" id="grid"></main>
<div class="toast" id="toast"></div>
<script src="../assets/data/works.js"></script>
<script>
(function(){
  var W=window.WORKS||{}, KEY='vh-craft-groups-v3', LIMIT={'2026':6,'GOGREEN':5,'HITIME':5,'KINGREST':5};
  var CRAFT=[
    {id:'craft-giftbox',brand:'2026 新品',kind:'实物',title:'电热毯礼盒',src:'assets/craft/giftbox.webp',group:'2026'},
    {id:'craft-controller',brand:'2026 新品',kind:'实物',title:'数显控制器',src:'assets/craft/controller.webp',group:'2026'},
    {id:'craft-cert',brand:'2026 新品',kind:'认证',title:'Intertek 认证',src:'assets/craft/cert.webp',group:'2026'}
  ];
  var items=CRAFT.concat((W.acc||[]).filter(function(a){return a.kind!=='三视图';}).map(function(a){
    return {id:a.id,brand:a.brand||'2026 新品',kind:a.kind,title:a.title,src:a.preview,group:(a.year===2026?'2026':a.brand)};
  }));
  var GROUPS=[['2026','2026 新品'],['GOGREEN','GOGREEN'],['HITIME','HITIME'],['KINGREST','KINGREST']];
  var DEFAULT={
    '2026':['a03','craft-giftbox','craft-cert','a05','a26-001','a06'],
    'GOGREEN':['a25-002','a25-055','a25-031','a25-045','a25-013'],
    'HITIME':['a25-081','a25-069','a25-082','a25-068','a25-074'],
    'KINGREST':['a25-093','a25-098','a25-099','a25-096','a25-100']
  };
  var picked={}, cur='2026';
  try{
    var saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved&&saved.groups) picked=saved.groups;
  }catch(e){}
  if(!Object.keys(picked).length){picked={};Object.keys(DEFAULT).forEach(function(k){picked[k]=DEFAULT[k].slice();});}
  Object.keys(DEFAULT).forEach(function(k){if(!picked[k])picked[k]=[];});
  function save(){localStorage.setItem(KEY,JSON.stringify({groups:picked}));}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},1600);}
  function groupLabel(g){var hit=GROUPS.filter(function(x){return x[0]===g;})[0];return hit?hit[1]:g;}
  function paint(){
    document.getElementById('groups').innerHTML=GROUPS.map(function(g){
      return '<button class="group'+(g[0]===cur?' on':'')+'" data-g="'+g[0]+'">'+g[1]+' '+picked[g[0]].length+'/'+LIMIT[g[0]]+'</button>';
    }).join('');
    document.getElementById('grid').innerHTML=items.filter(function(x){return x.group===cur;}).map(function(x){
      var on=picked[cur].indexOf(x.id)>-1;
      return '<button class="card'+(on?' on':'')+'" data-id="'+x.id+'"><span class="badge">已选</span><img src="../'+x.src+'" loading="lazy" alt=""><span class="meta"><b>'+x.title+'</b><span>'+x.brand+' · '+x.kind+'</span></span></button>';
    }).join('');
  }
  document.getElementById('groups').addEventListener('click',function(e){var b=e.target.closest('.group');if(!b)return;cur=b.dataset.g;paint();});
  document.getElementById('grid').addEventListener('click',function(e){
    var b=e.target.closest('.card');if(!b)return;
    if(cur==='2026'){toast('2026 先保持 6 件不动');return;}
    var id=b.dataset.id, arr=picked[cur], i=arr.indexOf(id);
    if(i>-1) arr.splice(i,1);
    else { if(arr.length>=LIMIT[cur]){toast(groupLabel(cur)+' 最多 '+LIMIT[cur]+' 件，先取消一件');return;} arr.push(id); }
    save();paint();
  });
  function data(){
    var out={};
    GROUPS.forEach(function(g){out[g[0]]=picked[g[0]].map(function(id){return items.filter(function(x){return x.id===id;})[0];}).filter(Boolean);});
    return out;
  }
  function validate(){
    for(var i=0;i<GROUPS.length;i++){var g=GROUPS[i],n=picked[g[0]].length,lim=LIMIT[g[0]];
      if(n<lim){toast(g[1]+' 还差 '+(lim-n)+' 件');return false;}
      if(n>lim){toast(g[1]+' 超过 '+lim+' 件');return false;}}
    return true;
  }
  document.getElementById('exportBtn').addEventListener('click',function(){
    if(!validate())return;
    var blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='craft-groups.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},800);toast('已导出 craft-groups.json');
  });
  document.getElementById('copyBtn').addEventListener('click',function(){
    if(!validate())return;
    var txt=JSON.stringify(data());
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){toast('已复制');},function(){toast('复制失败，用导出');});
    else toast('用导出 JSON');
  });
  paint();
})();
</script>
</html>
